<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>April Fool's Game 2025</title>
    <script src="utils/break_infinity.js"></script>
    <script src="utils.js"></script>
    <script src="frankenstein.js"></script>
    <script src="animation.js"></script>
    <script src="dialog.js"></script>
    <script src="main.js"></script>
    <script src="stage0.js"></script>
    <script src="stage1.js"></script>
<style>
@keyframes bgCycle {
    0% { background-color: white; color: black; }
    25% { background-color: red; color: white; }
    50% { background-color: green; color: white; }
    75% { background-color: blue; color: white; }
    100% { background-color: white; color: black; }
}
</style>
</head>

<body style="background-image: url(./bg.png)">
    <div id="stageBar" style="position: fixed; right: 10px; bottom: 10px; z-index: 9999; cursor: grab; user-select: none; touch-action: none; background-color: white; color: black; border: 2px solid black; padding: 6px 10px;">Stage: <span id="stageNum">0</span><br>This resource is here solely to make this game an incremental game.</div>
    <button id="nextLayerBtn" onclick="EnterNextLayer()" style="display:none; position: fixed; top: 10px; right: 10px; z-index: 1000;">Go to the next prestige layer</button>
    <div id="nextPrestigeLayer" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #111; color: white; z-index: 999; overflow: hidden;">
        <div id="frankensteinStage"></div>
    </div>
    <div id="startScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #222; z-index: 10000; overflow-y: scroll; display: flex; flex-direction: column; align-items: center;">
        <div style="height: 120vh; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; flex-shrink: 0;">
            scroll down to start playing
        </div>
        <img src="./rickroll.jpg" style="width: 80%; max-width: 600px;" alt="rickroll">
        <button onclick="StartGame()" style="margin: 40px; padding: 20px 40px; font-size: 20px;">Enter Game</button>
    </div>
    <div id="click" style="color: white;"></div>
    <button id="getclick" onclick="Click()">+1 point</button>
    <button id="getclick2" onclick="Click()" style="display:none">+1 point</button><br>
    <button id="ug0" onclick="BuyUg0()">Upgrade: Unlock a button as powerful as the last one. Cost: 25 points</button><br>
    <button id="ug2" onclick="BuyUg2()" style="display:none">Upgrade: Unlock a new button. Cost: 10 points</button><br>
    <button id="ug1" onclick="BuyUg1()" style="display:none">Upgrade: upgrades are slightly cheaper. Cost: 50 points</button><br>
    <button id="clickmax" onclick="ClickMax()">Click Max</button>
    <div id="ugs" style="display: flex; flex-direction: column; width: 30%;">
        <button onclick="BuyU()">Unlock a new upgrade. Cost: 1e6 points</button>
    </div>
    <div id="score" style="position: fixed;">
        <div style="width: 200px; flex-shrink: 0;">
            <button id="scorecount">You have 0 score</button>
            <button onclick="GetScore()">+1 score</button>
            <button onclick="ResetScore()">Reset all your score and score upgrades</button>
            <div onclick="Anal()">Click this to enable AI score gain breakdown (Requires 10 score)</div>
            <div id="prestigeUpgrades" style="display:none; margin-top: 10px;">
            <button id="mult1" onclick="BuyMultiplier(0)">Multiply score gain by an amount with big absolute value</button>
            <button id="mult2" onclick="BuyMultiplier(1)">Multiply score gain by an amount with big absolute value</button>
            <button id="mult3" onclick="BuyMultiplier(2)">Multiply score gain by an amount with big absolute value</button>
            <button id="unlockNextLayer" onclick="UnlockNextLayer()" style="display:none;">Unlock the next prestige layer</button>
            </div>
        </div>
        <div id="aipanel" style="flex: 1; border-left: 2px solid; padding: 4px; box-sizing: border-box; overflow: hidden; font-size: 11px; animation: bgCycle 4s infinite;"></div>
    </div>
</body>

</html>
