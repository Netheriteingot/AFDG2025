<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>April Fool's Game 2025</title>
    <script src="main.js"></script>
</head>

<body style="background-image: url(./bg.png)">
    <div id="click" style="color: white;"></div>
    <button id="getclick" onclick="Click()">+1 point</button>
    <button id="ug2" onclick="BuyUg2()">Upgrade: Unlock a new button. Cost: 10 points</button><br>
    <button id="ug1" onclick="BuyUg1()">Upgrade: upgrades are slightly cheaper. Cost: 50 points</button><br>
    <button id="clickmax" onclick="ClickMax()">Click Max</button>
    <div id="ugs" style="display: flex; flex-direction: column; width: 30%;">
        <button onclick="BuyU()">Unlock a new upgrade. Cost: 1e6 points</button>
    </div>
    <div id="score" style="position: fixed;">
        <button>You have 0 score</button>
        <div>Click this to get socres;</div>
        <div onclick="Anal()">Click this to enable AI score gain breakdown</div>
    </div>
</body>

</html>
